name: lan-monitor

x-scanner: &scanner
  build: ./scanner
  image: lan-monitor-scanner
  # Los escáneres necesitan ver la LAN real, no la red de Docker.
  network_mode: host
  cap_add: [NET_RAW, NET_ADMIN]
  environment:
    - TZ=${LAN_TZ:-America/Santiago}
    # Sin valor aquí: se pasan tal cual desde .env si están definidas (ver .env.example).
    - LAN_IFACE
    - LAN_NETWORK
    - LAN_GATEWAY
    - LAN_ARP_TIMEOUT
    - LAN_ARP_RETRY
    - LAN_SCAN_INTERVAL
    - LAN_SCAN_TOP_PORTS
    - LAN_SCAN_HOST_TIMEOUT
    - LAN_PORTS_INTERVAL
    - LAN_PORTS_MODE
    - LAN_PORTS_FAST_TOP
    - LAN_PORTS_FAST_TIMEOUT
    - LAN_PORTS_DEEP_TOP
    - LAN_PORTS_DEEP_TIMEOUT
    - LAN_TRAFFIC_FLUSH_SECS
    - LAN_TRAFFIC_TOP_CONNECTIONS
    - LAN_TRAFFIC_TOP_DNS
    - LAN_EXTERNAL_LOOKUPS
    - LAN_RETENTION_MIN
  volumes:
    - lan_logs:/var/log/lan-monitor
  restart: unless-stopped

services:

  # ── Escáneres ───────────────────────────────────────────────────────────────
  scanner-devices:
    <<: *scanner
    command: ["devices"]

  scanner-ports:
    <<: *scanner
    command: ["ports"]

  scanner-traffic:
    <<: *scanner
    command: ["traffic"]

  # ── ELK ─────────────────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-8.13.0}
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.name=lan-monitor
      - ES_JAVA_OPTS=-Xms${ES_HEAP:-1g} -Xmx${ES_HEAP:-1g}
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${ES_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION:-8.13.0}
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=lan-monitor
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q '\"level\":\"available\"' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  # Carga la plantilla de índices y el dashboard, y termina.
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-8.13.0}
    user: "0"
    entrypoint: ["/bin/bash", "/setup/setup.sh"]
    volumes:
      - ./elk/setup/setup.sh:/setup/setup.sh:ro
      - ./elk/elasticsearch/lanmon-template.json:/setup/lanmon-template.json:ro
      - ./elk/kibana/lanmon-dashboard.ndjson:/setup/lanmon-dashboard.ndjson:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
    restart: "no"

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELK_VERSION:-8.13.0}
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
      # Cada archivo se reparte en ~60 eventos: lotes chicos para no agotar la memoria.
      - PIPELINE_BATCH_SIZE=16
      # Un solo worker: los snapshots se procesan en orden (hace falta para los deltas).
      - PIPELINE_WORKERS=1
      - XPACK_MONITORING_ENABLED=false
      # GeoIP con la base incluida en la imagen, sin descargas.
      - XPACK_GEOIP_DOWNLOADER_ENABLED=false
      - LAN_TZ=${LAN_TZ:-America/Santiago}
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELK_VERSION:-8.13.0}
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - lan_logs:/var/log/lan-monitor:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      - logstash
    restart: unless-stopped

volumes:
  lan_logs:
  es_data:
  filebeat_data:
