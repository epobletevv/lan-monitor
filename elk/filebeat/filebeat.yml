# Los scripts escriben un JSON con sangría por archivo (no NDJSON).
# Filebeat solo junta el archivo completo en un evento; Logstash lo interpreta.
filebeat.inputs:

  - type: filestream
    id: lanmon-devices
    enabled: true
    # Cada archivo se abre una sola vez; se limita cuántos a la vez para no saturar Logstash.
    harvester_limit: 100
    close.on_state_change.inactive: 30s
    # Al reiniciar no revisa los archivos viejos (se cargaron hace rato) y los saca del registro.
    ignore_older: ${LAN_FILEBEAT_IGNORE_OLDER:6h}
    clean_inactive: ${LAN_FILEBEAT_CLEAN_INACTIVE:7h}
    paths:
      - /var/log/lan-monitor/lan_scan_*.json
    parsers:
      - multiline:
          type: pattern
          pattern: '^\{'
          negate: true
          match: after
          max_lines: 50000
          timeout: 5s
    fields:
      module: lan-devices
    fields_under_root: true

  - type: filestream
    id: lanmon-traffic
    enabled: true
    # Cada archivo se abre una sola vez; se limita cuántos a la vez para no saturar Logstash.
    harvester_limit: 100
    close.on_state_change.inactive: 30s
    # Al reiniciar no revisa los archivos viejos (se cargaron hace rato) y los saca del registro.
    ignore_older: ${LAN_FILEBEAT_IGNORE_OLDER:6h}
    clean_inactive: ${LAN_FILEBEAT_CLEAN_INACTIVE:7h}
    paths:
      - /var/log/lan-monitor/lan_traffic_*.json
    parsers:
      - multiline:
          type: pattern
          pattern: '^\{'
          negate: true
          match: after
          max_lines: 50000
          timeout: 5s
    fields:
      module: lan-traffic
    fields_under_root: true

  - type: filestream
    id: lanmon-ports
    enabled: true
    # Cada archivo se abre una sola vez; se limita cuántos a la vez para no saturar Logstash.
    harvester_limit: 100
    close.on_state_change.inactive: 30s
    # Al reiniciar no revisa los archivos viejos (se cargaron hace rato) y los saca del registro.
    ignore_older: ${LAN_FILEBEAT_IGNORE_OLDER:6h}
    clean_inactive: ${LAN_FILEBEAT_CLEAN_INACTIVE:7h}
    paths:
      - /var/log/lan-monitor/lan_ports_*.json
    parsers:
      - multiline:
          type: pattern
          pattern: '^\{'
          negate: true
          match: after
          max_lines: 50000
          timeout: 5s
    fields:
      module: lan-ports
    fields_under_root: true

  # Suricata escribe NDJSON (un evento por línea): no necesita multiline.
  # Solo se envían las alertas; flujos, DNS, TLS y estadísticas se quedan en el archivo.
  - type: filestream
    id: lanmon-suricata
    enabled: true
    paths:
      - /var/log/suricata/eve.json
    include_lines: ['"event_type": *"alert"']
    fields:
      module: suricata
    fields_under_root: true

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
