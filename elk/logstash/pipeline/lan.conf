input {
  beats {
    port => 5044
  }
}

# ── FILTER ────────────────────────────────────────────────────────────────────
filter {

  # Cada evento que llega es un archivo JSON completo (snapshot) en [message].
  # Se reparte en un evento por host / conexión / dominio / dispositivo / puerto.
  ruby {
    init => '
      require "json"
      require "time"
      require "digest"

      @state = {}
      @lock  = Mutex.new
      @run   = Mutex.new

      @mining = [8333, 9333, 3333, 4444, 5555, 7777, 14444, 45700]
      @c2     = [6667, 6697, 1080, 4545, 1337, 31337]

      @known = {
        53 => "DNS", 80 => "HTTP", 443 => "HTTPS", 22 => "SSH", 21 => "FTP",
        25 => "SMTP", 110 => "POP3", 143 => "IMAP", 993 => "IMAPS", 995 => "POP3S",
        587 => "SMTP/TLS", 8080 => "HTTP-alt", 8443 => "HTTPS-alt", 123 => "NTP",
        67 => "DHCP", 68 => "DHCP", 5353 => "mDNS", 1900 => "UPnP"
      }

      # Misma tabla que PORT_RISK en LanPorts.py
      @risk = {
        23 => ["critical", "Telnet — texto plano, sin cifrado"],
        21 => ["critical", "FTP — credenciales en texto plano"],
        512 => ["critical", "rexec — ejecución remota sin auth"],
        513 => ["critical", "rlogin — login remoto inseguro"],
        514 => ["critical", "rsh — shell remoto sin cifrado"],
        1337 => ["critical", "Puerto leet — malware conocido"],
        4444 => ["critical", "Minería XMR / Metasploit default"],
        8333 => ["critical", "Bitcoin P2P — posible minería"],
        9333 => ["critical", "Litecoin P2P — posible minería"],
        3333 => ["critical", "Minería Ethermine"],
        14444 => ["critical", "Minería Dwarfpool"],
        6667 => ["critical", "IRC — C2 botnet clásico"],
        31337 => ["critical", "BackOrifice — RAT histórico"],
        3389 => ["high", "RDP — escritorio remoto expuesto"],
        5900 => ["high", "VNC — escritorio remoto sin TLS"],
        5901 => ["high", "VNC display :1"],
        5902 => ["high", "VNC display :2"],
        1080 => ["high", "SOCKS proxy — posible C2"],
        8080 => ["high", "HTTP alternativo — panel expuesto"],
        9200 => ["high", "Elasticsearch sin auth por defecto"],
        6379 => ["high", "Redis sin auth por defecto"],
        27017 => ["high", "MongoDB sin auth por defecto"],
        5432 => ["high", "PostgreSQL expuesto"],
        3306 => ["high", "MySQL/MariaDB expuesto"],
        22 => ["medium", "SSH — revisar auth (deshabilitar password)"],
        80 => ["medium", "HTTP sin cifrado"],
        8443 => ["medium", "HTTPS alternativo"],
        2375 => ["medium", "Docker API sin TLS — peligroso"],
        2376 => ["medium", "Docker API con TLS"],
        6443 => ["medium", "Kubernetes API server"],
        10250 => ["medium", "Kubelet API"],
        445 => ["medium", "SMB — compartir archivos Windows"],
        139 => ["medium", "NetBIOS"],
        111 => ["medium", "RPC portmapper"],
        443 => ["low", "HTTPS — cifrado OK"],
        53 => ["low", "DNS resolver"],
        67 => ["low", "DHCP server"],
        123 => ["low", "NTP — sincronización horaria"],
        5353 => ["low", "mDNS — descubrimiento local"],
        1900 => ["low", "UPnP — descubrimiento"],
        9100 => ["low", "Impresora (JetDirect)"],
        631 => ["low", "CUPS — servidor de impresión"],
        548 => ["low", "AFP — Apple Filing Protocol"]
      }
      @risk_weight = { "critical" => 100, "high" => 40, "medium" => 10, "low" => 1, "info" => 0 }
      @risk_order  = ["critical", "high", "medium", "low", "info"]
    '
    code => '
      # El bloque no es seguro con varios workers a la vez: se ejecuta de a uno.
      @run.synchronize do
      raw  = event.get("message").to_s
      mod  = event.get("module").to_s
      path = event.get("[log][file][path]")

      # Filebeat no entrega la última línea si no termina en salto de línea,
      # y los scripts escriben el "}" final sin él.
      doc = nil
      begin
        doc = JSON.parse(raw)
      rescue StandardError
        begin
          doc = JSON.parse(raw + "\n}")
        rescue StandardError
          doc = nil
        end
      end

      if !doc.is_a?(Hash) || doc["timestamp"].nil?
        event.set("[@metadata][idx]", "errors")
        event.set("[error][raw]", raw[0, 2000])
        event.set("[event][dataset]", "error.json")
        event.set("source_file", path) if path
        ["message", "agent", "ecs", "input", "log", "host", "event.original"].each { |f| event.remove(f) }
        event.remove("[event][original]")
        event.tag("_lan_json_invalido")
      else
        ts = doc["timestamp"].to_s

        emit = lambda do |idx, dataset, fields, opts|
          h = { "module" => mod, "snapshot_ts" => (opts[:ts] || ts), "event" => { "dataset" => dataset } }
          h["event"]["kind"] = opts[:kind] if opts[:kind]
          h["source_file"] = path if path
          lan = {}
          lan["gateway"] = doc["gateway"] if doc["gateway"]
          lan["network"] = doc["network"] if doc["network"]
          h["lan"] = lan unless lan.empty?
          h.merge!(fields)
          e = LogStash::Event.new(h)
          e.set("[@metadata][idx]", idx)
          e.set("[@metadata][doc_id]", opts[:id]) if opts[:id]
          new_event_block.call(e)
        end

        # Los contadores del sniffer son acumulados desde que arrancó el servicio.
        # Se calcula la diferencia contra el snapshot anterior (≈60 s) cuando es consecutivo.
        delta = lambda do |key, dur, vals|
          out = nil
          @lock.synchronize do
            prev = @state[key]
            if prev && dur > prev[0] && (dur - prev[0]) <= 180
              out = {}
              vals.each do |k, v|
                d = v.to_i - prev[1][k].to_i
                out[k] = d if d >= 0
              end
              out = nil if out.size != vals.size
            end
            @state.clear if @state.size > 50000
            @state[key] = [dur, vals]
          end
          out
        end

        scope = lambda do |ip|
          s = ip.to_s
          if s == "255.255.255.255" || s.end_with?(".255")
            "broadcast"
          elsif s.start_with?("224.", "239.")
            "multicast"
          elsif s.start_with?("10.", "192.168.", "127.") || s =~ /\A172\.(1[6-9]|2[0-9]|3[01])\./
            "private"
          else
            "public"
          end
        end

        threat = lambda do |port|
          if @mining.include?(port)
            { "category" => "crypto-mining", "severity" => "critical" }
          elsif @c2.include?(port)
            { "category" => "c2-botnet", "severity" => "high" }
          end
        end

        clean = lambda do |v|
          s = v.to_s.strip
          (s.empty? || s == "—" || s == "Desconocido") ? nil : s
        end

        # ── lan-traffic ─────────────────────────────────────────────────────
        if mod == "lan-traffic"
          dur   = doc["duration_secs"].to_i
          hosts = doc["hosts"].is_a?(Hash) ? doc["hosts"] : {}

          totals = { "packets" => doc["packets"].to_i, "bytes_in" => doc["bytes_in"].to_i, "bytes_out" => doc["bytes_out"].to_i }
          tprev  = nil
          @lock.synchronize { tprev = @state["summary"] }
          td = delta.call("summary", dur, totals)
          interval = (td && tprev) ? dur - tprev[0] : nil

          t = totals.merge("uptime_secs" => dur, "host_count" => hosts.size)
          t["delta"] = td if td
          if interval && interval > 0
            t["interval_secs"] = interval
            # Ancho de banda del intervalo, en bits por segundo.
            t["rate"] = { "bps_in"  => (td["bytes_in"]  * 8.0 / interval).round,
                          "bps_out" => (td["bytes_out"] * 8.0 / interval).round }
          end
          emit.call("traffic", "traffic.summary", { "traffic" => t }, {})

          hosts.each do |ip, d|
            next unless d.is_a?(Hash)
            vals = { "bytes_out" => d["out"].to_i, "bytes_in" => d["in"].to_i, "packets" => d["packets"].to_i }
            hd = delta.call("host|" + ip.to_s, dur, vals)
            hd = vals.dup if hd.nil? && td   # host nuevo desde el snapshot anterior
            t = vals.merge("bytes_total" => vals["bytes_out"] + vals["bytes_in"])
            if hd
              t["delta"] = hd.merge("bytes_total" => hd["bytes_out"] + hd["bytes_in"])
              if interval && interval > 0
                t["interval_secs"] = interval
                t["rate"] = { "bps_in"  => (hd["bytes_in"]  * 8.0 / interval).round,
                              "bps_out" => (hd["bytes_out"] * 8.0 / interval).round }
              end
            end
            emit.call("traffic", "traffic.host", { "source" => { "ip" => ip.to_s }, "traffic" => t }, {})
          end

          (doc["top_connections"] || []).each_with_index do |c, i|
            next unless c.is_a?(Hash)
            port = c["port"].to_i
            vals = { "packets" => c["packets"].to_i }
            cd   = delta.call("conn|" + [c["src"], c["dst"], port].join("|"), dur, vals)
            t    = vals.merge("rank" => i + 1)
            t["delta"] = cd if cd
            dst = { "ip" => c["dst"].to_s, "port" => port, "scope" => scope.call(c["dst"]) }
            dst["service"] = @known[port] if @known[port]
            f = { "source" => { "ip" => c["src"].to_s }, "destination" => dst, "traffic" => t }
            th = threat.call(port)
            f["threat"] = th if th
            emit.call("traffic", "traffic.connection", f, {})
          end

          (doc["top_dns"] || []).each_with_index do |q, i|
            next unless q.is_a?(Hash)
            vals = { "count" => q["count"].to_i }
            dd   = delta.call("dns|" + q["domain"].to_s, dur, vals)
            dns  = { "question" => { "name" => q["domain"].to_s }, "count" => vals["count"], "rank" => i + 1 }
            dns["delta"] = dd["count"] if dd
            emit.call("traffic", "traffic.dns", { "dns" => dns }, {})
          end

          # Las alertas se repiten en cada snapshot: el _id fijo evita duplicados.
          # Los snapshots antiguos solo traen la hora (HH:MM:SS) de cada alerta; el día se
          # deduce como la primera vez que esa hora ocurre después del arranque del sniffer.
          fmt   = "%Y-%m-%d %H:%M:%S"
          snap  = Time.strptime(ts[0, 19], fmt)
          start = snap - dur
          (doc["alerts"] || []).each do |a|
            next unless a.is_a?(Hash)
            # Broadcast y multicast no salen de la LAN: no son alertas (ej. descubrimiento Tuya).
            next if ["broadcast", "multicast"].include?(scope.call(a["dst"]))
            begin
              if a["timestamp"]
                at = Time.strptime(a["timestamp"].to_s[0, 19], fmt)
              else
                at = Time.strptime(start.strftime("%Y-%m-%d") + " " + a["time"].to_s, fmt)
                at += 86400 if at < start
                at = snap if at > snap
              end
            rescue StandardError
              at = snap
            end
            awhen = at.strftime(fmt)
            port = a["port"].to_i
            dst  = { "ip" => a["dst"].to_s, "port" => port, "scope" => scope.call(a["dst"]) }
            f = {
              "source"      => { "ip" => a["src"].to_s },
              "destination" => dst,
              "alert"       => { "key" => a["key"].to_s, "description" => a["desc"].to_s }
            }
            th = threat.call(port)
            f["threat"] = th if th
            id = Digest::SHA1.hexdigest([awhen, a["key"]].join("|"))
            emit.call("alerts", "alert", f, { :ts => awhen + ".000000", :kind => "alert", :id => id })
          end

        # ── lan-devices / lan-ports ─────────────────────────────────────────
        elsif mod == "lan-devices" || mod == "lan-ports"
          is_ports = (mod == "lan-ports")
          idx      = is_ports ? "ports" : "devices"
          devices  = doc["devices"].is_a?(Array) ? doc["devices"] : []
          gateway  = doc["gateway"].to_s
          open_total = 0
          with_ports = 0

          devices.each do |d|
            next unless d.is_a?(Hash)
            ports = (d["ports"] || []).map { |p| p.to_i }
            svcs  = d["services"].is_a?(Hash) ? d["services"] : {}
            open_total += ports.size
            with_ports += 1 unless ports.empty?

            levels = ports.map { |p| (@risk[p] || ["info"])[0] }
            top    = @risk_order.find { |l| levels.include?(l) }

            dev = {
              "ip" => d["ip"].to_s, "mac" => d["mac"].to_s,
              "open_ports" => ports, "port_count" => ports.size,
              "is_gateway" => (d["ip"].to_s == gateway),
              "services" => ports.map { |p| p.to_s + "/" + (clean.call(svcs[p.to_s]) || "?") }
            }
            ["vendor", "hostname", "os"].each do |k|
              v = clean.call(d[k])
              dev[k] = v if v
            end
            if !ports.empty?
              dev["risk"]       = top
              dev["risk_score"] = levels.map { |l| @risk_weight[l] }.sum
            end
            dev["scan_error"] = d["error"].to_s if d["error"]

            f = { "device" => dev }
            f["scan"] = { "mode" => doc["scan_mode"] } if doc["scan_mode"]
            emit.call(idx, idx + ".device", f, {})

            if is_ports
              ports.each do |p|
                r = @risk[p] || ["info", "Puerto abierto"]
                pf = { "number" => p, "risk" => r[0], "description" => r[1] }
                s  = clean.call(svcs[p.to_s])
                pf["service"] = s if s
                dmin = { "ip" => dev["ip"], "mac" => dev["mac"], "is_gateway" => dev["is_gateway"] }
                dmin["vendor"] = dev["vendor"] if dev["vendor"]
                f = { "device" => dmin, "port" => pf }
                f["scan"] = { "mode" => doc["scan_mode"] } if doc["scan_mode"]
                emit.call(idx, "ports.port", f, {})
              end
            end
          end

          s = { "device_count" => devices.size, "devices_with_ports" => with_ports, "open_port_total" => open_total }
          s["mode"] = doc["scan_mode"] if doc["scan_mode"]
          emit.call(idx, idx + ".summary", { "scan" => s }, {})

        else
          event.set("[@metadata][idx]", "errors")
          event.tag("_lan_modulo_desconocido")
        end

        event.cancel if event.get("[@metadata][idx]").nil?
      end
      end
    '
  }

  # Los scripts escriben la hora local sin zona.
  if [snapshot_ts] {
    date {
      match        => [ "snapshot_ts", "yyyy-MM-dd HH:mm:ss.SSSSSS", "yyyy-MM-dd HH:mm:ss" ]
      timezone     => "${LAN_TZ:America/Santiago}"
      target       => "@timestamp"
      remove_field => [ "snapshot_ts" ]
    }
  }

  # Organización / ISP y país de los destinos de internet, con la base GeoLite2
  # que trae Logstash (no consulta ningún servicio externo).
  if [destination][scope] == "public" {
    geoip {
      source                => "[destination][ip]"
      target                => "[destination]"
      default_database_type => "ASN"
      tag_on_failure        => []
    }
    geoip {
      source         => "[destination][ip]"
      target         => "[destination]"
      fields         => ["country_name", "country_code2", "location"]
      tag_on_failure => []
    }
  }
}

# ── OUTPUT ────────────────────────────────────────────────────────────────────
output {
  if [@metadata][doc_id] {
    elasticsearch {
      hosts           => ["http://elasticsearch:9200"]
      index           => "lanmon-%{[@metadata][idx]}-%{+YYYY.MM}"
      document_id     => "%{[@metadata][doc_id]}"
      manage_template => false
    }
  } else if [@metadata][idx] {
    elasticsearch {
      hosts           => ["http://elasticsearch:9200"]
      index           => "lanmon-%{[@metadata][idx]}-%{+YYYY.MM}"
      manage_template => false
    }
  }
}
